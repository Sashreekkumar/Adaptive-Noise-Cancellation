[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noisygen"
version = "1.2.0"
description = "Modular noisy-speech dataset generator with provenance metadata, mp3 output, and impulsive noise events."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
noisygen = "noisygen.cli:main"

[tool.setuptools.packages.find]
include = ["noisygen*"]x